    get:
      tags: [Backups]
      operationId: getAppBackups
      summary: List backups
      description: How every database of the app is backed up, and the moments a restore can go back to. Quick moments come first (1 minute, 15 minutes, 1 hour ago, yesterday this time), then the moments moin remembered before a deploy, a data edit or a catalog update, and the copies it took before each restore, newest first. Only moments inside the last 7 days of history show. Read from the server and the bucket.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
