          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_backups` without a bucket, `server_offline`, `agent_outdated` when the agent is too old.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

