      operationId: editBucket
      summary: Change a bucket
      description: Sets every field of a bucket. An empty `name` keeps the name, an empty `secret_key` keeps the stored key, `default` makes it the default. A new place or new keys are checked first; its apps then start there with a full copy and the old place keeps what it has.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. The workspace has no bucket by this name.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`, `fields.endpoint`, `fields.bucket` or `fields.secret_key`.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Backups]
      operationId: deleteBucket
      summary: Remove a bucket
      description: Forgets a bucket. A bucket that apps use, or that keeps older backups of an app, is refused. What is in the bucket stays.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The bucket is forgotten.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. The workspace has no bucket by this name.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`bucket_in_use` when apps use it or it keeps older backups; the message names the apps.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/bucket:
    parameters:
      - $ref: '#/components/parameters/AppName'
    put:
      tags: [Backups]
      operationId: setAppBucket
      summary: Choose the app's bucket
      description: Moves the app's uploads and new backups to a bucket of the workspace; an empty `bucket` follows the default. Its history starts again in the new bucket; what is in the old bucket stays there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppBucketRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app or no bucket by this name.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_backups` when the workspace has no bucket.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/alert-destinations:
    get:
      tags: [Alerts]
      operationId: listAlertDestinations
      summary: List alert destinations
      description: Every alert destination of the workspace, without its URL, bot token or signing secret. `hint` shows the host and the last characters. `failing` says sends to it fail since `failing_since`, with `last_error`. Every member may list them.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The alert destinations by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDestinationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Alerts]
      operationId: createAlertDestination
      summary: Add an alert destination
      description: 'Stores a destination with its URL or bot token sealed with AES-256-GCM. `slack` takes an incoming webhook `url` (https://hooks.slack.com/services/…), `discord` a webhook `url` (https://discord.com/api/webhooks/…), `telegram` a `bot_token` and a `chat_id`, `webhook` any http or https `url`. `events` picks from uptime.down, uptime.up, server.down, server.up, deploy.failed, backup.failed, backup.recovered, drill.failed, drill.recovered, disk.full, disk.ok and update.available; empty means all. A webhook answers with its `signing_secret`, this once: every post carries `X-Moin-Signature: sha256=<hex HMAC-SHA256 of the body>`. Only owners and admins.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertDestinationRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '201':
          description: The new destination, with `signing_secret` for a webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAlertDestination'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`forbidden` for members: only owners and admins add destinations.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`alert_limit` at 20 destinations.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.kind`, `fields.name`, `fields.url`, `fields.bot_token`, `fields.chat_id` or `fields.events`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/alert-destinations/{destination}:
    parameters:
      - $ref: '#/components/parameters/AlertDestination'
    delete:
      tags: [Alerts]
      operationId: deleteAlertDestination
      summary: Remove an alert destination
      description: Only owners and admins.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The destination is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`forbidden` for members.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No destination with this ID or name.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/alert-destinations/{destination}/test:
    parameters:
      - $ref: '#/components/parameters/AlertDestination'
    post:
      tags: [Alerts]
      operationId: testAlertDestination
      summary: Send a test alert
      description: Sends a test alert to the destination and waits up to 10 seconds for it to take it. A webhook gets `"event":"test"`. Only owners and admins.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The destination took the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDestination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`forbidden` for members.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No destination with this ID or name.'
        '424':
          description: '`alert_send_failed`. The destination did not take the test; the message says why, without its URL or token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github:
    get:
      tags: [GitHub]
      operationId: getGitHub
      summary: GitHub connection
      description: Where the moin GitHub App is installed, the link that connects GitHub, and the link that installs it on another account or organization.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The installations.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, installations]
                properties:
                  enabled:
                    type: boolean
                  connect_url:
                    type: string
                    description: Connects GitHub. If the app is already installed, it connects those installations; if not, it installs the app.
                  install_url:
                    type: string
                    description: Installs the app on another account or organization.
                  installations:
                    type: array
                    items:
                      type: object
                      required: [id, account, settings_url]
                      properties:
                        id:
                          type: integer
                        account:
                          type: string
                        settings_url:
                          type: string
                          description: The page on github.com where the account chooses the repos moin may read. For an installation connected before moin kept it, the install link, which leads there too.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github/repos:
    get:
      tags: [GitHub]
      operationId: getGitHubRepos
      summary: List repos
      description: Every repo the user's installations of the moin GitHub App may read.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The repos.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [full_name, default_branch, private, account]
                      properties:
                        full_name:
                          type: string
                        default_branch:
                          type: string
                        private:
                          type: boolean
                        account:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/github/repos/{owner}/{repo}/branches:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: repo
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [GitHub]
      operationId: getGitHubBranches
      summary: List branches
      description: The branches of a repo moin may read, the default branch first.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The branch names.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.repo` when moin cannot read the repo.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/repo:
    parameters:
      - $ref: '#/components/parameters/AppName'
    put:
      tags: [GitHub]
      operationId: setAppRepo
      summary: Link a repo
      description: The app follows a repo and branch; an empty branch is the repo's default branch. With `auto_deploy` every push to the branch deploys, and moin writes the result as the commit status `moin/deploy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo]
              properties:
                repo:
                  type: string
                  example: me/blog
                branch:
                  type: string
                auto_deploy:
                  type: boolean
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`github_off` when the control plane has no GitHub App.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.repo`, or with `fields.branch` when the repo on GitHub has no branch by this name.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [GitHub]
      operationId: deleteAppRepo
      summary: Unlink the repo
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app follows no repo.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/security:
    parameters:
      - name: id
        in: path
        required: true
        description: The server's ID or name.
        schema:
          type: string
    put:
      tags: [Servers]
      operationId: setServerSecurity
      summary: Lock down a server
      description: 'How the server is reached: `tunnel` creates a Cloudflare Tunnel with the stored Cloudflare token, routes every app domain through it, points their DNS at it and closes 80 and 443. `ssh_tailscale` joins the tailnet with the stored Tailscale key and answers SSH only there, once Tailscale is up. `firewall` drops every other inbound connection. The agent applies it at once, or when it connects; `security` in the answer says what it set up.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnel:
                  type: boolean
                ssh_tailscale:
                  type: boolean
                firewall:
                  type: boolean
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server with what its agent set up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_cloudflare` or `no_tailscale` when the key is missing.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/metrics:
    parameters:
      - name: id
        in: path
        required: true
        description: The server's ID or name.
        schema:
          type: string
      - $ref: '#/components/parameters/MetricsRange'
    get:
      tags: [Metrics]
      operationId: getServerMetrics
      summary: Get server metrics
      description: 'CPU, memory, the disk that holds the apps'' data, network and load of a server: the newest sample, the points over the range, and every app on it with its newest sample, the one with the most memory first. `now` is null when the agent sent nothing for two minutes.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetrics'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `range` when it is not 1h, 24h, 7d or 30d.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/integrations:
    get:
      tags: [Servers]
      operationId: getIntegrations
      summary: Get integrations
      description: Whether a Cloudflare API token and a Tailscale auth key are stored. The keys never come back.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Servers]
      operationId: setIntegrations
      summary: Set integrations
      description: 'Stores the Cloudflare API token, checked against Cloudflare first, and the Tailscale auth key, both encrypted. A missing field keeps its key, an empty one removes it. The token needs Account: Cloudflare Tunnel Edit and Zone: DNS Edit; Zone: Zone Settings Edit is optional and lets moin turn on Always Use HTTPS.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cloudflare_token:
                  type: string
                tailscale_key:
                  type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The integrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.cloudflare_token` or `fields.tailscale_key`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/agent-updates:
    get:
      tags: [Servers]
      operationId: getAgentUpdates
      summary: Get automatic agent updates
      description: Whether the agents of the workspace update to the control plane's version by themselves. On by default.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdates'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Servers]
      operationId: setAgentUpdates
      summary: Turn automatic agent updates on or off
      description: With `auto` on, an agent older than the control plane updates when it connects, one server at a time, never during a deploy and never on a server with rules. An agent that does not come back stops it for the workspace, and the activity says so; an update by hand starts it again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdates'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdates'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.auto`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/env:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Apps]
      operationId: getAppEnv
      summary: Get env vars
      description: In plain text. Tokens need the write scope, because reading secrets is as strong as writing them.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The env vars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Env'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      tags: [Apps]
      operationId: updateAppEnv
      summary: Set env vars
      description: Sets and removes env vars. They are stored encrypted and take effect with the next deploy. A rollback keeps the env of its release.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvRequest'
      responses:
        '200':
          description: All env vars after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Env'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.set`.'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Apps]
      operationId: replaceAppEnv
      summary: Replace all env vars
      description: Makes the sent env vars the app's, all at once, like one .env file. What is new or changed is set, keys not sent are removed. Answers what changed. They take effect with the next deploy.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceEnvRequest'
      responses:
        '200':
          description: All env vars after the change, and what changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacedEnv'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.set`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The workspaces of the account with its role in each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '201':
          description: The new workspace, owned by the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
