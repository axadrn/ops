                type: integer
              last_at:
                type: string
                format: date-time
        total:
          type: integer
        last_at:
          type: string
          format: date-time
          description: The newest request; missing without one.
        quiet:
          type: boolean
          description: Nothing arrived for quiet_days days, so the old address can go.
        quiet_days:
          type: integer
