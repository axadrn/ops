        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.host` or `fields.password`.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Apps]
      operationId: deleteRegistry
      summary: Remove a registry login
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The login is removed.
        '401':
