      description: The workspace, the role and permissions of the caller, members, pending invitations for members who may manage them, and seats.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      responses:
        '204':
          description: The workspace is deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
