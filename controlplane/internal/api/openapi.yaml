        '202':
          description: The started rollback deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running`, `no_rollback` or `release_gone` when the server no longer keeps that release.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/update:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Catalog]
      operationId: updateApp
      summary: Update a catalog app
      description: Sets VERSION to the version, the newest release when empty, and deploys the app's compose.yml from the catalog. moin remembers the moment before, so a restore can go back to it. An older version goes too, but its migrations may not go back.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdateRequest'
      responses:
        '202':
          description: The app and its started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDeploy'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`not_from_catalog`, `server_offline`, `deploy_running` or `no_bucket`.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.version`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/redeploy:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: redeployApp
      summary: Redeploy
      description: Builds the source of the newest deploy that had one again, with the env as it is now.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '202':
          description: The started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '401':
