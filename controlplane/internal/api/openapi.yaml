  /api/v1/apps/{app}/domains:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Apps]
      operationId: checkDomains
      summary: Check domains
      description: Looks up every domain of the app and says whether it points at the address its server's agent connects from.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One check per domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainChecks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Apps]
      operationId: setDomains
      summary: Set domains
      description: 'Replaces the domains and the canonical one, which the others redirect to (empty for none). With `service`, replaces the domains of that service of compose.yml instead of the main one''s. HTTPS is always on; Traefik gets certificates from Let''s Encrypt. The `x-moin` block of compose.yml wins for every field it sets.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainsRequest'
      responses:
        '200':
          description: The app. Saving never restarts it: the change waits for a restart, start or deploy, and `deploy` is null (control planes before saving waited could answer the restart they started).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`domains_from_compose`. x-moin.domains in compose.yml sets the domains of the live deploy; change them there and deploy.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.domains`, `fields.canonical` or `fields.service`.'
        '500':
          $ref: '#/components/responses/Internal'

