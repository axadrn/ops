    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Backups]
      operationId: downloadBackup
      summary: Download a copy
      description: The agent makes a full copy of a database (SQLite gzipped, Postgres as pg_dump in its custom format) and puts it in the app's own bucket under downloads/, where it stays a day. Nothing goes through the control plane. It runs on its own; follow it with getBackupDownload, which gives a short-lived signed link to the bucket once it is ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '202':
          description: The copy runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDownload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
