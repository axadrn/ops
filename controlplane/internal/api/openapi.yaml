        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` or `no_source`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/hook:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: rotateDeployHook
      summary: Create a deploy hook
      description: 'Gives the app a new secret deploy hook URL and answers it once; the old URL stops working. CI calls `POST <url>` with `{"image": "ghcr.io/me/app:tag"}` or `?image=` after pushing an image. The hook reuses the compose file of the running release.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The hook URL, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployHook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Apps]
      operationId: deleteDeployHook
      summary: Turn the deploy hook off
      description: The hook URL stops working and CI can no longer deploy the app. A new hook can be made again later. Answers 204 also when the app had no hook. Works while the plan allows no changes.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app has no deploy hook.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/registries:
