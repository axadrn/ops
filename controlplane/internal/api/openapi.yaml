    OldAddress:
      type: object
      required: [hosts, days, rows, total, quiet, quiet_days]
      properties:
        hosts:
          type: array
          items:
            type: string
          description: The old hosts the control plane still answers on.
        days:
          type: integer
          description: How many days rows reaches back.
        rows:
          type: array
          items:
            type: object
            required: [day, host, kind, requests, last_at]
            properties:
              day:
                type: string
