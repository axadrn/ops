        description: The id downloadBackup answered.
    get:
      tags: [Backups]
      operationId: getBackupDownload
      summary: Get a download
      description: How a copy stands. Once `state` is `ready`, `link` is a signed link to the copy in the app's own bucket, valid 15 minutes; ask again for a fresh one. A copy lasts a day.
      security:
        - bearerAuth: []
        - cookieAuth: []
