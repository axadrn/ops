          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/stop:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: stopApp
      summary: Stop an app
      description: Stops the containers of the app. They stay stopped, also after a reboot of the server, until a deploy, a restart or a start. Data and settings stay. Changes to domains and protection wait for the start.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app is stopped.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` or `not_live` before the first deploy.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
