      description: Emails an invitation link to `APP_URL/workspaces/invitations/{token}`. The invitation appears in `GET /api/v1/workspaces/{workspaceSlug}`.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '202':
          description: The invitation is created and on its way.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`seat_limit` when the plan has no free seat, `already_member` when the address belongs to a member.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
