    get:
      tags: [Apps]
      operationId: getInstant
      summary: Get the instant address
      description: 'The app''s instant address, `<app>.<server IPv4 with dashes>.<provider>`, with HTTPS: or why it has none, such as a server behind a Cloudflare Tunnel. A password guards it unless it is open: the app''s own one when it has one, else one moin made, shown with `show=true`, which needs a token with read and write access.'
      security:
