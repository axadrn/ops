          description: '`validation_failed` with `fields.email` or `fields.role`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/invitations/{invitationID}:
