        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`last_owner`. Hand over ownership first.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/activity:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceActivity
      summary: List workspace activity
      description: Activity events, newest first. Pass `next_cursor` as `cursor` to read the next page.
      parameters:
        - name: limit
          in: query
          description: Events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Keep the same filters.
          schema:
            type: string
        - name: app
          in: query
          description: Only events of this app, by name.
          schema:
            type: string
        - name: server
          in: query
          description: Only events of this server and of the apps on it, by name.
          schema:
            type: string
        - name: user
          in: query
          description: Only events of this member, by email or user ID.
          schema:
            type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          description: '`invalid_cursor`. Start again without a cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.limit`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/activity:
    get:
      tags: [Workspaces]
      operationId: listActivity
      summary: List activity
      description: What happened in the workspace of the API token, newest first, the same as listWorkspaceActivity, for the CLI: deploys, rollbacks, restores, SQL writes, env, domains, servers, security and member changes. Pass `next_cursor` as `cursor` to read the next page.
      parameters:
        - name: limit
          in: query
          description: Events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page. Keep the same filters.
          schema:
            type: string
        - name: app
          in: query
          description: Only events of this app, by name.
          schema:
            type: string
        - name: server
          in: query
          description: Only events of this server and of the apps on it, by name.
          schema:
            type: string
        - name: user
          in: query
          description: Only events of this member, by email or user ID.
          schema:
            type: string
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          description: '`invalid_cursor`. Start again without a cursor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.limit`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing:
