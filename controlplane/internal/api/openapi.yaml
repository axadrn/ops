openapi: 3.1.0
info:
  title: "moin API"
  version: v1
  description: |
    JSON API of moin. Every endpoint under `/api/v1` uses the same
    services and rules as the web app.

    Authentication: sign in with one of the `/api/v1/auth` endpoints and send the returned
    token as `Authorization: Bearer <token>`. A browser frontend on the same site may use
    the `session_token` cookie instead. Cookie requests that change state need the
    `X-CSRF-Token` header with the token from `GET /api/v1/csrf`. Requests with an
    `Authorization: Bearer` header never use cookies and need no CSRF token. Other
    schemes, such as Basic auth added by a proxy, keep the cookie and its CSRF check.

    Cookie sign-in: a browser app on the same origin adds `?session=cookie` to a sign-in
    endpoint. The answer then sets the HttpOnly `session_token` cookie and carries no token,
    so scripts never see it. These sign-ins always need the `X-CSRF-Token` header.

    Personal API tokens: a signed-in user creates them with `POST /api/v1/account/tokens`,
    or a CLI gets one by logging in through the browser (`POST /api/v1/auth/device`), and sends one as `Authorization: Bearer pat_...` from scripts, integrations and AI agents.
    A token acts for its user on the operations that list `apiTokenAuth`, with the scope the
    operation names: `read` for reads, `write` for changes. A token without that scope gets
    403 `insufficient_scope`, and a token on any other operation gets 403 `forbidden`.
    Tokens never manage sessions, tokens, email, password, billing, admin or deletions.
    Tokens never change member roles or remove members.
    Each token is bound to one workspace: other workspaces answer 404 and are left out of
    lists.

    Errors: every non-2xx JSON answer is the `Error` envelope with a stable lowercase
    snake case `code`. `fields` is present only for `validation_failed`.

    Times are RFC 3339 in UTC. Lists answer `{"items": [...]}`. Request bodies are
    `application/json` unless an endpoint says otherwise, at most 1 MiB, and unknown
    fields are rejected.

    CORS: browsers on the origins in `CORS_ALLOWED_ORIGINS` may call `/api/` with
    credentials and read the `Retry-After` header of a 429 answer.
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Meta
    description: The API description, the project name and support address, and the CSRF token for cookie sessions.
  - name: Auth
    description: Sign-in, onboarding and logout. Sign-in answers carry a bearer token and set no cookie, unless they ask for a cookie session with `session=cookie`.
  - name: Account
    description: The signed-in account.
  - name: Sessions
    description: Active sessions of the signed-in account.
  - name: API tokens
    description: Personal API tokens of the signed-in account. Only a signed-in session manages them. Recovering the account with a forgot password link, changing, setting or removing the password, and an admin signing the user out everywhere revoke every token. Signing out other sessions keeps them.
  - name: Workspaces
    description: Workspaces, members, invitations and activity.
  - name: Invitations
    description: Workspace invitations opened with the token from the invitation email.
  - name: Billing
    description: Workspace subscriptions, checkout and billing management.
  - name: Status
    description: 'Whether everything is OK in a workspace: what needs you (failed deploys, broken backups or restore checks, servers offline, full disks, domains down, agents behind), catalog apps with a newer release, and what runs well.'
  - name: Catalog
    description: 'Open source apps moin installs in one click, such as Umami or n8n. Each entry is a compose.yml that ships with moin; its versions are the releases in the image registry, read once an hour. An installed app is an ordinary app: its secrets are env vars and VERSION picks the image tag.'
  - name: Apps
    description: 'Apps are Docker Compose projects on a server. A deploy sends the source; the agent detects compose.yml, a Dockerfile or a Go module, reads the optional `x-moin` block, builds, starts and checks it. Env vars are stored encrypted. Everything in the moin endpoints belongs to the workspace of the API token.'
  - name: Data
    description: Browse, edit and query the databases of an app on its server, SQLite and Postgres.
  - name: Backups
    description: The backup of every SQLite and Postgres database, in your own S3-compatible bucket only, never through the control plane. moin writes down every change and keeps it 7 days; a restore goes back to any minute and can be undone for 7 days; every day moin checks that going back works; a full copy downloads with a short-lived link into your bucket.
  - name: Uptime
    description: The control plane checks every domain of every live app once a minute, like a visitor, and keeps uptime for 24 hours, 7 and 30 days and the last outages. Down and back up again go to the activity.
  - name: Alerts
    description: Where the alerts of a workspace go besides email, when a site goes down or comes back, a server goes offline or comes back, or a deploy fails. Slack and Discord incoming webhooks, a Telegram bot, or a webhook of your own, signed with HMAC-SHA256. Every member sees them; owners and admins add, test and remove them.
  - name: Metrics
    description: Every agent samples its server and the containers of its apps every 15 seconds. The control plane keeps the last hour of samples, minutes for 24 hours and hours for 30 days.
  - name: GitHub
    description: The moin GitHub App connects repos. Link a repo and branch to an app, deploy a ref without a checkout, deploy every push, and get the result as a commit status.
  - name: Servers
    description: Servers with a moin agent. The web UI, the CLI and the TUI use the same endpoints. A server is online while its agent holds a session.
  - name: Admin
    description: Operator dashboard data and session revocation. Admins only.
  - name: OAuth
    description: Browser redirect flows. They end in a cookie session and are not JSON endpoints.

paths:
  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPI
      summary: Get this OpenAPI document
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/csrf:
    get:
      tags: [Meta]
      operationId: getCSRFToken
      summary: Get the CSRF token
      description: |
        Returns the CSRF token for cookie requests and sets the `csrf_token` cookie when it is
        missing. Send the token as `X-CSRF-Token` on every cookie request that changes state.
        Bearer clients do not need it.
      security: []
      responses:
        '200':
          description: The CSRF token of this browser.
          headers:
            Set-Cookie:
              description: The HttpOnly `csrf_token` cookie, when the request had none.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFToken'

  /api/v1/meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: Get the project name, support address and version
      security: []
      responses:
        '200':
          description: Public facts about the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'

  /api/v1/version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Get the version and the newest release
      description: The control plane's version for everyone. A self-hosted control plane (`self_hosted`) also answers the newest release on GitHub, which it asks once a day unless `UPDATE_CHECK=false`, with its "In short" line as `summary`, the notes and their URL, and the update under way or of the past day. `can_update` is true for an admin in `ADMIN_EMAILS` while a newer release is out and the updater runs. The hosted control plane updates with every release and leaves these fields empty.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'

  /api/v1/version/update:
    post:
      tags: [Meta]
      operationId: updateControlPlane
      summary: Update the control plane to the newest release
      description: For an admin of a self-hosted control plane. The updater next to it pulls the new image and restarts the control plane, which snapshots its database and migrates it. If the new version does not answer within two minutes, the updater starts the old one again. Follow `update.state` with `GET /api/v1/version`: `requested`, `updating`, then `done`, `rolled_back` or `failed` with a `reason`. The activity of the workspace notes the start and the end.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '202':
          description: The update is requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`forbidden` for anyone but an admin in `ADMIN_EMAILS`.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`hosted` on the hosted control plane, `up_to_date`, `no_updater` when the updater does not run, or `update_running`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: signInWithPassword
      summary: Sign in with email and password
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          description: '`invalid_credentials`. Wrong email or password, an unverified address, or an account without a password.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.email` or `fields.password`.'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/magic-link:
    post:
      tags: [Auth]
      operationId: sendMagicLink
      summary: Email a sign-in link
      description: |
        Emails a link to `APP_URL/auth/magic-link/{token}` and creates the account when the
        address is new. The answer is the same whether or not an account exists. The page at
        that link calls `POST /api/v1/auth/magic-link/verify` with the token. While sign-up is
        closed (`SIGNUPS_OPEN=false`, the default of a self-hosted control plane), a new address
        gets 403 `private`; admins and invited addresses still get a link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: The link is on its way when the address can receive one.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`private`: sign-up is closed; ask its admin for an invitation.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.email`.'
        '429':
          $ref: '#/components/responses/RateLimited'
          description: '`rate_limited`. Too many links for this client IP or this address.'

  /api/v1/auth/magic-link/verify:
    post:
      tags: [Auth]
      operationId: verifyMagicLink
      summary: Sign in with a magic link token
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: sendForgotPasswordLink
      summary: Email a password reset link
      description: |
        Emails a link to `APP_URL/auth/forgot-password/{token}`. The answer is the same whether
        or not an account exists. The page at that link calls
        `POST /api/v1/auth/forgot-password/verify` with the token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: The link is on its way when an account exists.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.email`.'
        '429':
          $ref: '#/components/responses/RateLimited'
          description: '`rate_limited`. Too many links for this client IP or this address.'

  /api/v1/auth/forgot-password/verify:
    post:
      tags: [Auth]
      operationId: verifyForgotPassword
      summary: Sign in with a password reset token
      description: Removes the password, signs out every other session, revokes every personal API token, and returns a new session. Set a new password with `POST /api/v1/account/password/set`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/email-change/verify:
    post:
      tags: [Auth]
      operationId: verifyEmailChange
      summary: Confirm an email change
      description: |
        Moves the pending address to the account, signs out every session of the account, and
        returns a new session. A cookie caller also gets the new session cookie. The link in the
        email points to `APP_URL/auth/verify-email-change/{token}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/SessionMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/device:
    post:
      tags: [Auth]
      operationId: startDeviceLogin
      summary: Start a login in the browser
      description: |
        `moin login` without a token: the device authorization grant of RFC 8628. The answer
        has the `device_code` the client keeps secret and the `user_code` the user confirms at
        `verification_uri`, or opens `verification_uri_complete` directly. The page signs the
        user in first with any sign-in method. Then poll `POST /api/v1/auth/device/token`
        every `interval` seconds until it answers a token, or `expires_in` seconds pass.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
      responses:
        '200':
          description: The login waits for the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLogin'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/device/token:
    post:
      tags: [Auth]
      operationId: pollDeviceLogin
      summary: Poll a login in the browser for its token
      description: |
        Answers the token once the user approved the login, exactly once. The token is a
        personal API token of the kind `device`, read and write, bound to the workspace the
        user picked, named after the computer ("CLI on <computer name>"). It expires 90 days after its
        last use; each use extends it. It shows under Settings, Tokens and is revoked there.
        Until then the answer is 400 with a code of RFC 8628, section 3.5:
        `authorization_pending` (poll again after `interval`), `slow_down` (add 5 seconds to
        the interval, then poll again), `access_denied` (the user denied it),
        `expired_token` (start again) or `invalid_grant` (an unknown code, or one that got its
        token already).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: The login is approved. `access_token` is shown this one time only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceToken'
        '400':
          description: '`authorization_pending`, `slow_down`, `access_denied`, `expired_token`, `invalid_grant`, `unsupported_grant_type` or `invalid_body`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`token_limit`. The user has 50 API tokens; they revoke one and log in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/onboarding:
    post:
      tags: [Auth]
      operationId: completeOnboarding
      summary: Complete onboarding
      description: Sets the name of a new account and creates its first workspace when it has none. With `invitation_token` of an available invitation for the account's email address no workspace is created, because the account joins the invited workspace next through `POST /api/v1/invitations/{token}/accept`. Every other endpoint answers `onboarding_required` until this is done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: The onboarded account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name` or `fields.workspace_name`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: Revokes the session of the bearer token, or the cookie session and its cookie.
      responses:
        '204':
          description: The session is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`forbidden` for a cookie request without a valid `X-CSRF-Token` header. Logout stays available during impersonation.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: Get the signed-in account
      description: Works before onboarding and reports `onboarding_required`.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the account
      description: Deletes the account after the caller types its email address. Every session ends with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: The account is deleted.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`sole_workspace_owner`. Transfer or delete the workspaces the account owns alone first.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.confirm_email` when it does not match the account email.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/name:
    patch:
      tags: [Account]
      operationId: updateAccountName
      summary: Change the display name
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/email-alerts:
    put:
      tags: [Account]
      operationId: setEmailAlerts
      summary: Turn email alerts on or off
      description: With `on`, the signed-in user gets a mail when a site goes down or comes back, a server goes offline or comes back, or a deploy fails, in every workspace they own or run as admin. Only a verified address gets them. On by default; `email_alerts` in `GET /api/v1/account` says how it is set.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAlerts'
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAlerts'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.on`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/email:
    patch:
      tags: [Account]
      operationId: requestEmailChange
      summary: Change the email address
      description: |
        Emails a verification link to the new address. The address changes once the link is
        confirmed with `POST /api/v1/auth/email-change/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: The verification link is on its way.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`email_taken`. Another account uses this address.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.email`, also when the address is the current one.'
        '429':
          $ref: '#/components/responses/RateLimited'
          description: '`rate_limited`. Too many email changes for this account or this address.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/password:
    post:
      tags: [Account]
      operationId: changePassword
      summary: Change the password
      description: Replaces the password, signs out every other session, and revokes every personal API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password is changed.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`password_not_set`. The account has no password, set one first.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.current_password` or `fields.new_password`.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Account]
      operationId: removePassword
      summary: Remove the password
      description: Makes the account passwordless, signs out every other session, and revokes every personal API token.
      responses:
        '204':
          description: The password is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`password_not_set`. The account has no password.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/password/set:
    post:
      tags: [Account]
      operationId: setPassword
      summary: Add a password
      description: Adds a password to a passwordless account, signs out every other session, and revokes every personal API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: The password is set.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`password_already_set`. Change the password instead.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.password`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List active sessions
      responses:
        '200':
          description: Every active session. The session of this request has `current` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Sessions]
      operationId: revokeOtherSessions
      summary: Sign out every other session
      description: Personal API tokens stay valid. Revoke them one by one with `DELETE /api/v1/account/tokens/{id}`.
      responses:
        '204':
          description: Only the current session is left.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionID'
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Sign out one session
      description: Revoking the current session signs the caller out, and a cookie caller also loses the cookie.
      responses:
        '204':
          description: The session is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No active session with this ID belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/tokens:
    get:
      tags: [API tokens]
      operationId: listAPITokens
      summary: List personal API tokens
      description: Newest first. Expired tokens stay listed with `expired` set until they are revoked. The token itself is never shown again.
      responses:
        '200':
          description: Every token of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`onboarding_required`, `forbidden` for a personal API token.'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [API tokens]
      operationId: createAPIToken
      summary: Create a personal API token
      description: Answers the token once. Store it right away; only its hash is kept. An account holds at most 50 tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPITokenRequest'
      responses:
        '201':
          description: The new token and its raw value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIToken'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`onboarding_required`, `forbidden` for a personal API token or a cookie request without a valid `X-CSRF-Token` header, `impersonation_read_only` during impersonation.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`token_limit`. Revoke a token first.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`, `fields.scopes`, `fields.expires_in_days` or `fields.workspace_id`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/APITokenID'
    delete:
      tags: [API tokens]
      operationId: revokeAPIToken
      summary: Revoke a personal API token
      description: Requests with the token answer 401 from now on.
      responses:
        '204':
          description: The token is revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
          description: '`onboarding_required`, `forbidden` for a personal API token or a cookie request without a valid `X-CSRF-Token` header, `impersonation_read_only` during impersonation.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No token with this ID belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/account/avatar:
    post:
      tags: [Account]
      operationId: uploadAvatar
      summary: Upload an avatar
      description: Replaces the avatar. The request is `multipart/form-data` with the image in the field `file`, at most 10 MB.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: A JPEG, PNG or WebP image.
      responses:
        '200':
          description: The new avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          $ref: '#/components/responses/InvalidBody'
          description: '`invalid_body`. The body is not multipart or larger than 10 MB.'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.file` when the field is missing or the file is not an accepted image.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Account]
      operationId: deleteAvatar
      summary: Remove the avatar
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The avatar is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List servers
      description: By name.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: Every server of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Servers]
      operationId: createServer
      summary: Add a server
      description: Answers the install command once. Its install token connects one agent within an hour. An empty name gets a generated one.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: The new server and its install command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServer'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/events:
    get:
      tags: [Servers]
      operationId: streamServers
      summary: Stream servers
      description: 'Server-sent events. Each `servers` event carries the full `ServerList`: once on connect and again after every change. Comment lines keep the stream open.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    patch:
      tags: [Servers]
      operationId: renameServer
      summary: Rename a server
      description: The same rules as adding one. Its apps stay on it; they point at the server, not its name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameServerRequest'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The renamed server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`: not 1 to 63 lowercase letters, digits or dashes starting with a letter or digit, or taken in the workspace.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Remove a server
      description: Disconnects its agent. The agent token stops working. The agent stays installed on the machine until you run `uninstall_command` there; it is empty when no agent ever connected.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server is removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedServer'

        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_has_apps`. The server is online and has apps: remove them first. An offline server goes with its apps.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/install:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    post:
      tags: [Servers]
      operationId: newInstallCommand
      summary: New install command
      description: A new install token and command for the server, shown this once, for one hour; moin stores only a fingerprint of it. The old install command stops working. An agent that registers with it takes over the server, and the agent token of the old one stops working.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '201':
          description: The server and its new install command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/servers/{id}/update:
    parameters:
      - $ref: '#/components/parameters/ServerID'
    post:
      tags: [Servers]
      operationId: updateAgent
      summary: Update the agent of a server
      description: The agent downloads the binary this control plane serves for its OS and CPU, from the control plane URL it is registered with, checks it against the SHA-256 the control plane sends, swaps it in and restarts through systemd. The answer comes once the new agent is connected, within three minutes. An agent refuses while a deploy runs, without systemd, and when its server has rules in `/etc/moin/rules`; agents older than the update say so with the command that updates them on the server.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '200':
          description: The server with the new agent version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, or `no_agent_binary` when the control plane serves no binary for the server.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Is everything OK?
      description: What needs you, most urgent first, each with the path of the web page to fix it under the workspace; catalog apps a newer release is out for; and counts of what runs well. `ok` is false when an issue needs you; updates never make it false.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The workspace now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: listCatalog
      summary: List the catalog
      description: Every app of the catalog with its newest release. `latest` is null until the image registry answered.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The catalog, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/catalog/{slug}:
    parameters:
      - $ref: '#/components/parameters/CatalogSlug'
    get:
      tags: [Catalog]
      operationId: getCatalogApp
      summary: A catalog app
      description: One app of the catalog with every release, newest first. A release from GHCR has no date.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The catalog app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. The catalog has no app with this slug.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/catalog/{slug}/install:
    parameters:
      - $ref: '#/components/parameters/CatalogSlug'
    post:
      tags: [Catalog]
      operationId: installCatalogApp
      summary: Install a catalog app
      description: Creates the app on the server, generates every secret its compose.yml needs as an env var, sets VERSION and deploys it from the app's bucket. An empty version takes the newest release, an empty name the slug.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogInstallRequest'
      responses:
        '202':
          description: The new app and its started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDeploy'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No such catalog app or server.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, or `no_bucket` when the workspace has no bucket to put the source in.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`, `fields.version`, or `fields.domain` for an app that needs one.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: List apps
      description: What needs you first (a failed deploy, an offline server), then what deploys, then pinned apps, then the rest by name, with the newest and the live deploy of each.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: Every app of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Apps]
      operationId: createApp
      summary: Add an app
      description: The name is also the compose project on the server.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
      responses:
        '201':
          description: The new app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No server with this ID or name belongs to the account.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.name`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/pin:
    put:
      tags: [Apps]
      operationId: setAppPinned
      summary: Pin or unpin an app
      description: With `pinned` true, every list of the workspace shows the app above the others that run fine, on every surface. The activity records it.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      parameters:
        - $ref: '#/components/parameters/AppName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: '`validation_failed` with `fields.pinned`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/events:
    get:
      tags: [Apps]
      operationId: streamApps
      summary: Stream apps
      description: 'Server-sent events. Each `apps` event carries the full `AppList`: once on connect and again after every change. Comment lines keep the stream open.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}:
    parameters:
      - $ref: '#/components/parameters/AppName'
    get:
      tags: [Apps]
      operationId: getApp
      summary: Get an app
      description: The app and its 20 newest deploys, without logs.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Apps]
      operationId: deleteApp
      summary: Remove an app
      description: The agent stops the app and removes its containers and images. Volumes and data stay on the server.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '204':
          description: The app is removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`.'
        '424':
          $ref: '#/components/responses/AgentError'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/deploys:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: createDeploy
      summary: Deploy
      description: 'Starts a deploy. `{"upload": "...", "sha256": "..."}` deploys a source the CLI put into your bucket through createUpload; the server downloads it, checks the SHA-256 and deletes it from the bucket. `{"image": "..."}` deploys an image built elsewhere with the compose file of the running release. `{"ref": "main"}` has the server download that branch, tag or commit of the linked GitHub repo; `{}` deploys the linked branch. moin never stores your code. Follow the deploy with its events.'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upload:
                  type: string
                  example: up_9x2k4m...
                sha256:
                  type: string
                image:
                  type: string
                  example: ghcr.io/me/blog:3f2a9c1
                ref:
                  type: string
                  example: main
      responses:
        '202':
          description: The started deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deploy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`server_offline`, `deploy_running` while another deploy of the app runs, `no_bucket` for an upload without a bucket, `no_repo` for a ref without a linked repo.'
        '415':
          $ref: '#/components/responses/Conflict'
          description: '`update_ops`: a gzipped body from an old CLI; sources go to your bucket now.'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.upload`, `fields.image` or `fields.ref`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/uploads:
    parameters:
      - $ref: '#/components/parameters/AppName'
    post:
      tags: [Apps]
      operationId: createUpload
      summary: Sign an upload
      description: A link valid for 15 minutes that takes a gzipped tar of the source with a PUT, straight into your own bucket. moin signs it with your bucket's key and never sees the code. Deploy it with createDeploy and the upload ID.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [write]
      responses:
        '201':
          description: The upload.
          content:
            application/json:
              schema:
                type: object
                required: [upload, url]
                properties:
                  upload:
                    type: string
                  url:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/OnboardedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. No app with this ID or name belongs to the account.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`no_bucket` when no bucket is set up.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/apps/{app}/deploys/{number}:
    parameters:
      - $ref: '#/components/parameters/AppName'
      - $ref: '#/components/parameters/DeployNumber'
    get:
      tags: [Apps]
      operationId: getDeploy
      summary: Get a deploy
      description: With its log so far.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
