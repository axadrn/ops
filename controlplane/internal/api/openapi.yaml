      properties:
        id:
          type: string
        actor_user_id:
          type: [string, 'null']
        actor_email:
          type: string
        workspace_id:
          type: [string, 'null']
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: string
