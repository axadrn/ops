      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiTokenAuth: [read]
      responses:
        '200':
          $ref: '#/components/responses/Billing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing/checkout:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    post:
      tags: [Billing]
      operationId: createWorkspaceCheckout
      summary: Start a checkout for the workspace
      description: Only members who may manage billing. Open the returned URL in a browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProviderURL'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`checkout_pending` while a checkout is being created, `checkout_conflict` when a checkout for another plan is open, `already_paid`.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidCheckout'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/billing/manage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceSlug'
    get:
      tags: [Billing]
      operationId: getWorkspaceBillingManagement
      summary: Open billing management for the workspace
      description: Only members who may manage billing. Open the returned URL in a browser.
      responses:
        '200':
          $ref: '#/components/responses/ProviderURL'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
          description: '`forbidden` when the role may not manage billing, `onboarding_required`, or `impersonation_read_only` during impersonation because billing management is a provider session.'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '409':
          $ref: '#/components/responses/NoBillingAccount'
        '500':
          $ref: '#/components/responses/Internal'

