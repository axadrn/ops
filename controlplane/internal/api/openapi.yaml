        '400':
          $ref: '#/components/responses/InvalidBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`not_found`. Unknown workspace or member.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`last_owner`. A workspace keeps at least one owner.'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
          description: '`validation_failed` with `fields.role`.'
        '500':
          $ref: '#/components/responses/Internal'

  /api/v1/workspaces/{workspaceSlug}/leave:
